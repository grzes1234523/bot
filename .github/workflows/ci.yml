name: Sprawdzenie projektu

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Node.js, składnia i testy
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
      - name: Ustaw Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Zainstaluj zależności
        run: npm ci
      - name: Sprawdź składnię i uruchom testy
        run: npm run check
      - name: Sprawdź pliki wdrożeniowe
        run: >-
          node --input-type=module -e "import fs from 'node:fs'; for (const file of ['.env.example','.gitignore','README.md','render.yaml','migrations/001_json_documents.sql','migrations/002_ticket_embed_relations.sql']) { if (!fs.existsSync(file)) throw new Error('Brak wymaganego pliku: ' + file); }"
